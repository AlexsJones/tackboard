[package]
name = "tackboardctl"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { version = "1.0.140" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = {version = "1.45.1", features = ["full"]}
env_logger = "0.11.8"
tokio-util = {  version = "0.7.15", features = ["codec"] }
futures = "0.3.31"
tokio-serde = { version = "0.9.0", features = ["bincode", "json", "serde_json"] }
log = "0.4.27"
tackboardlib = {  path = "../tackboardlib" }
uuid = { version = "1", features = ["v4"] }  # v4 = random UUIDs